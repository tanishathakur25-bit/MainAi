<!DOCTYPE html>
<html>
<head>
    <title>Ask Gemini</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h2>Ask Gemini</h2>
        <p>Your AI Assistant</p>
    </header>

    <main>
        <h1>Ask Anything</h1>
        <p class="subtitle">Ask Gemini your questions and get an AI-powered answer.</p>

        <div class="ask-box">
            <input id="question" placeholder="Type your question here...">
            <button onclick="askGemini()">Ask Gemini</button>
        </div>

        <div class="answer-box">
            <h3>Answer</h3>
            <p id="answer">Your answer will appear here...</p>
        </div>
    </main>

   <footer>
    <div class="footer-content">
        <h3>Ask Gemini</h3>
        <p>Ask questions. Get smart answers. Learn something new.</p>

        <div class="footer-links">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </div>

        <hr>

        <p class="copyright">
            © 2026 Ask Gemini. Built with Node.js, Express & Gemini AI.
        </p>
    </div>
</footer>

    <script src="script.js"></script>
</body>
</html>
